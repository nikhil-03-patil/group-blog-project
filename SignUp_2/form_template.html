<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Template</title>
  <link rel="stylesheet" href="form_template.css">
</head>
<body>
  <div class="container">
    <div class="box"></div>

    <div class="container-forms">
      <div class="container-info">
        <!-- Left info -->
        <div class="info-item">
          <div class="table">
            <div class="table-cell">
              <p>Have an account?</p>
              <div class="btn">Log in</div>
            </div>
          </div>
        </div>

        <!-- Right info -->
        <div class="info-item">
          <div class="table">
            <div class="table-cell">
              <p>Don't have an account?</p>
              <div class="btn">Sign up</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form area -->
      <div class="container-form">
        <!-- Login form -->
        <div class="form-item log-in">
          <div class="table">
            <div class="table-cell">
              <input type="text" name="Username" placeholder="Username">
              <input type="password" name="Password" placeholder="Password">
              <div class="btn">Log in</div>
            </div>
          </div>
        </div>

        <!-- Signup form -->
        <div class="form-item sign-up">
          <div class="table">
            <div class="table-cell">
              <input type="text" name="email" placeholder="Email">
              <input type="text" name="fullName" placeholder="Full Name">
              <input type="text" name="Username" placeholder="Username">
              <input type="password" name="Password" placeholder="Password">
              <div class="btn">Sign up</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Rabbit link -->
  <a class="box-item" href="https://codepen.io/Anna_Batura/" target="_blank">
    <svg class="rabbit" viewBox="0 0 600 600" version="1.2">
      <path id="rabbit" d="m 335.94313,30.576451 ..."></path>
    </svg>
  </a>

  <script src="form_template.js"></script>
</body>
</html>
